{% extends "base.html" %}
{% block content %}

    <div class="article-container">
      <h1>Confirm Delete</h1>
    <p>Are you sure you want to delete the article "{{ article.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-pill delete-btn">Yes, Delete</button>
        <a href="{% url 'article' article.id %}" class="btn-pill btn-cancel">Cancel</a>
    </form>
    </div>
{% endblock content %}
