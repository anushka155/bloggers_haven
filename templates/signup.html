{% extends "base.html" %}
{% block content %}

<div class="auth-container">
    <h1>Sign Up</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-pill">Sign Up</button>
    </form>
    <p class="redirect-link">
        Already have an account? <a href="{% url 'user_login' %}">Log in here</a>.
    </p>
</div>

{% endblock content %}
